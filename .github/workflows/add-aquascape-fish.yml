name: Add Aquascape & Fish category

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-category:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add category
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "{name:'Room Rent',icon:'🏠'}, {name:'Clothing',icon:'👕'}, {name:'Souvenirs & Gifts',icon:'🎁'}, {name:'Other Expenses',icon:'✨'}"
          new = "{name:'Room Rent',icon:'🏠'}, {name:'Clothing',icon:'👕'}, {name:'Souvenirs & Gifts',icon:'🎁'}, {name:'Aquascape & Fish',icon:'🐠'}, {name:'Other Expenses',icon:'✨'}"
          if 'Aquascape & Fish' not in s:
              if old not in s:
                  raise SystemExit('Could not find the category list in index.html')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit and push, then remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-aquascape-fish.yml
          git add index.html
          if git diff --cached --quiet; then
            echo "Aquascape & Fish already exists."
            exit 0
          fi
          git commit -m "Add Aquascape & Fish category"
          git push