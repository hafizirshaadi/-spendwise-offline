name: Update SpendWise features

on:
  push:
    paths:
      - '.github/workflows/update-features.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch SpendWise UI
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '.filter-head{display:flex;align-items:center;justify-content:space-between;margin:17px 1px 8px}.filter-head span{font-size:12px;font-weight:800;color:var(--muted)}.filter-head button{border:0;background:transparent;color:var(--green2);font-size:11px;font-weight:800;padding:4px}.category-chips{display:flex;flex-wrap:wrap;gap:7px}.category-chip{border:1px solid var(--line);background:var(--input);color:var(--muted);padding:8px 10px;border-radius:99px;font-size:11px;font-weight:750}.category-chip.active{background:var(--green);border-color:var(--green);color:#fff}.filtered-total',
              '.filter-head{display:flex;align-items:center;justify-content:space-between;margin:17px 1px 8px}.filter-head span{font-size:12px;font-weight:800;color:var(--muted)}.filter-head button{border:0;background:transparent;color:var(--green2);font-size:11px;font-weight:800;padding:4px}.category-search{position:relative;margin:8px 0}.category-search:before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-52%);font-size:21px;color:var(--muted);pointer-events:none}.category-search input{padding-left:40px}.category-filter-scroll{max-height:210px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:2px 3px 4px}.category-chips{display:flex;flex-wrap:wrap;gap:7px}.category-chip{border:1px solid var(--line);background:var(--input);color:var(--muted);padding:8px 10px;border-radius:99px;font-size:11px;font-weight:750}.category-chip.active{background:var(--green);border-color:var(--green);color:#fff}.filtered-total'
          )

          s = s.replace(
              '.expense{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}.expense:last-child{border:0}.cat-icon',
              '.expense{display:grid;grid-template-columns:22px 42px 1fr auto;gap:9px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft);user-select:none}.expense:last-child{border:0}.expense.dragging{opacity:.45}.drag-handle{width:22px;height:42px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;font-size:18px;cursor:grab;touch-action:none}.drag-handle:active{cursor:grabbing}.cat-icon'
          )

          s = s.replace(
              '<div class="filter-head"><span>Filter by category</span><button id="clearCategoryFilter" type="button">Select all</button></div><div id="categoryFilters" class="category-chips"></div>',
              '<div class="filter-head"><span>Filter by category</span><button id="clearCategoryFilter" type="button">Select all</button></div><div class="category-search"><input id="categorySearch" type="search" placeholder="Search category" autocomplete="off" aria-label="Search categories"></div><div class="category-filter-scroll"><div id="categoryFilters" class="category-chips"></div></div>'
          )

          s = s.replace(
              "const STORAGE_KEY='spendwise-expenses-v1';",
              "const STORAGE_KEY='spendwise-expenses-v1';\nconst ORDER_KEY='spendwise-expense-order-v1';"
          )

          s = s.replace(
              "let expenses=load(), editingId=null, period='day', page=1, searchQuery='';const selectedCategories=new Set(),selectedPayments=new Set();const PAGE_SIZE=10;",
              "let expenses=load(), editingId=null, period='day', page=1, searchQuery='', categorySearchQuery='';const selectedCategories=new Set(),selectedPayments=new Set();const PAGE_SIZE=10;\nlet expenseOrder=loadOrder();"
          )

          s = s.replace(
              "function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(expenses))}",
              "function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(expenses))}\nfunction loadOrder(){try{const saved=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]');const ids=new Set(expenses.map(e=>e.id));const keep=saved.filter(id=>ids.has(id));const missing=expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||''))).map(e=>e.id).filter(id=>!keep.includes(id));const order=[...keep,...missing];localStorage.setItem(ORDER_KEY,JSON.stringify(order));return order}catch{return expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||''))).map(e=>e.id)}}\nfunction saveOrder(){localStorage.setItem(ORDER_KEY,JSON.stringify(expenseOrder))}\nfunction orderedExpenses(list){const pos=new Map(expenseOrder.map((id,i)=>[id,i]));return list.slice().sort((a,b)=>(pos.get(a.id)??999999)-(pos.get(b.id)??999999))}\nfunction syncOrder(){const ids=new Set(expenses.map(e=>e.id));expenseOrder=expenseOrder.filter(id=>ids.has(id));for(const e of expenses)if(!expenseOrder.includes(e.id))expenseOrder.push(e.id);saveOrder()}\nfunction reorderVisible(ids){const visible=new Set(ids),positions=expenseOrder.map((id,i)=>visible.has(id)?i:-1).filter(i=>i>=0);if(!positions.length)return;const first=Math.min(...positions);expenseOrder=expenseOrder.filter(id=>!visible.has(id));expenseOrder.splice(first,0,...ids);saveOrder()}"
          )

          s = s.replace(
              "function selected(){const {start,end}=bounds();return expenses.filter(e=>inRange(e,start,end)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt))}",
              "function selected(){const {start,end}=bounds();return orderedExpenses(expenses.filter(e=>inRange(e,start,end)))}"
          )

          s = s.replace(
              "const expenseResults=searchQuery?applyFilters(expenses).filter(e=>e.title.toLocaleLowerCase().includes(searchQuery)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)):list;",
              "const expenseResults=searchQuery?orderedExpenses(applyFilters(expenses).filter(e=>e.title.toLocaleLowerCase().includes(searchQuery))):list;"
          )

          s = s.replace(
              "slice.map(e=>`<div class=\"expense\"><div class=\"cat-icon\">${iconFor(e.category)}</div>",
              "slice.map(e=>`<div class=\"expense\" draggable=\"true\" data-expense-id=\"${e.id}\"><button class=\"drag-handle\" type=\"button\" aria-label=\"Drag to reorder\" title=\"Drag to reorder\">☷</button><div class=\"cat-icon\">${iconFor(e.category)}</div>"
          )

          s = s.replace(
              "  $('prevPage')?.addEventListener('click',()=>{page--;render()});$('nextPage')?.addEventListener('click',()=>{page++;render()})\n}",
              "  $('prevPage')?.addEventListener('click',()=>{page--;render()});$('nextPage')?.addEventListener('click',()=>{page++;render()})\n}\nfunction persistRenderedOrder(){const ids=[...document.querySelectorAll('#expenseList .expense[data-expense-id]')].map(el=>el.dataset.expenseId);if(ids.length){reorderVisible(ids);render()}}\nlet dragId=null,dragPointerId=null;\n$('expenseList').addEventListener('dragstart',e=>{const row=e.target.closest('.expense[data-expense-id]');if(!row)return;dragId=row.dataset.expenseId;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});\n$('expenseList').addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();const row=e.target.closest('.expense[data-expense-id]');if(!row||row.dataset.expenseId===dragId)return;const source=$(`#expenseList .expense[data-expense-id=\"${dragId}\"]`);if(!source)return;const rect=row.getBoundingClientRect();row.parentNode.insertBefore(source,e.clientY<rect.top+rect.height/2?row:row.nextSibling)});\n$('expenseList').addEventListener('drop',e=>{if(!dragId)return;e.preventDefault();const source=$(`#expenseList .expense[data-expense-id=\"${dragId}\"]`);if(source)source.classList.remove('dragging');dragId=null;persistRenderedOrder()});\n$('expenseList').addEventListener('dragend',()=>{document.querySelectorAll('#expenseList .dragging').forEach(el=>el.classList.remove('dragging'));if(dragId){dragId=null;persistRenderedOrder()}});\n$('expenseList').addEventListener('pointerdown',e=>{const handle=e.target.closest('.drag-handle');if(!handle)return;const row=handle.closest('.expense[data-expense-id]');if(!row)return;dragId=row.dataset.expenseId;dragPointerId=e.pointerId;row.classList.add('dragging');handle.setPointerCapture?.(e.pointerId);e.preventDefault()});\n$('expenseList').addEventListener('pointermove',e=>{if(!dragId||e.pointerId!==dragPointerId)return;e.preventDefault();const row=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.expense[data-expense-id]');const source=document.querySelector(`#expenseList .expense[data-expense-id=\"${dragId}\"]`);if(!row||!source||row===source)return;const rect=row.getBoundingClientRect();row.parentNode.insertBefore(source,e.clientY<rect.top+rect.height/2?row:row.nextSibling)});\n$('expenseList').addEventListener('pointerup',e=>{if(!dragId||e.pointerId!==dragPointerId)return;dragPointerId=null;document.querySelectorAll('#expenseList .dragging').forEach(el=>el.classList.remove('dragging'));persistRenderedOrder();dragId=null});\n$('expenseList').addEventListener('pointercancel',e=>{if(!dragId||e.pointerId!==dragPointerId)return;dragPointerId=null;document.querySelectorAll('#expenseList .dragging').forEach(el=>el.classList.remove('dragging'));dragId=null;render()});\n"
          )

          s = s.replace(
              "save();resetForm();selectDate(record.date);page=1;renderFilterControls();render()",
              "save();expenseOrder=[record.id,...expenseOrder.filter(id=>id!==record.id)];saveOrder();resetForm();selectDate(record.date);page=1;renderFilterControls();render()"
          )

          s = s.replace(
              "if(del&&confirm('Delete this expense?')){expenses=expenses.filter(v=>v.id!==del);save();render();toast('Expense deleted.')}",
              "if(del&&confirm('Delete this expense?')){expenses=expenses.filter(v=>v.id!==del);expenseOrder=expenseOrder.filter(id=>id!==del);save();saveOrder();render();toast('Expense deleted.') }"
          )

          s = s.replace(
              "function renderCategoryFilters(){$('categoryFilters').innerHTML=categories.map(c=>`<button type=\"button\" class=\"category-chip${selectedCategories.has(c.name)?' active':''}\" data-filter-category=\"${escapeHtml(c.name)}\" aria-pressed=\"${selectedCategories.has(c.name)}\">${c.icon} ${escapeHtml(c.name)}</button>`).join('');$('clearCategoryFilter').textContent=selectedCategories.size?'Clear filters':'All selected'}",
              "function renderCategoryFilters(){const q=categorySearchQuery;const visible=categories.filter(c=>!q||c.name.toLocaleLowerCase().includes(q));$('categoryFilters').innerHTML=visible.length?visible.map(c=>`<button type=\"button\" class=\"category-chip${selectedCategories.has(c.name)?' active':''}\" data-filter-category=\"${escapeHtml(c.name)}\" aria-pressed=\"${selectedCategories.has(c.name)}\">${c.icon} ${escapeHtml(c.name)}</button>`).join(''):'<div class=\"empty\" style=\"padding:12px\">No category found.</div>';$('clearCategoryFilter').textContent=selectedCategories.size?'Clear filters':'All selected'}"
          )

          s = s.replace(
              "$('expenseSearch').addEventListener('input',e=>{searchQuery=e.target.value.trim().toLocaleLowerCase();page=1;render()});",
              "$('expenseSearch').addEventListener('input',e=>{searchQuery=e.target.value.trim().toLocaleLowerCase();page=1;render()});\n$('categorySearch').addEventListener('input',e=>{categorySearchQuery=e.target.value.trim().toLocaleLowerCase();renderCategoryFilters()});"
          )

          s = s.replace(
              "expenses.push({id,title,amount,date:d,category,mealType,payment,createdAt:new Date().toISOString()});known.add(id);added++}",
              "expenses.push({id,title,amount,date:d,category,mealType,payment,createdAt:new Date().toISOString()});expenseOrder.push(id);known.add(id);added++}"
          )

          s = s.replace("save();page=1;render();toast(`${added} expense${added===1?'':'s'} imported.`)","save();syncOrder();page=1;render();toast(`${added} expense${added===1?'':'s'} imported.`)")

          p.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          t = sw.read_text(encoding='utf-8').replace("const CACHE='spendwise-offline-v21';","const CACHE='spendwise-offline-v22';")
          sw.write_text(t, encoding='utf-8')

          if 'categorySearch' not in s or 'drag-handle' not in s or 'ORDER_KEY' not in s:
              raise SystemExit('Patch verification failed: expected feature markers are missing.')

      - name: Commit updated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'Add category search and draggable expense ordering'
          git push
