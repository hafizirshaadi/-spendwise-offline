name: Add transport categories

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-categories:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Bus Ticket and Car Fuel categories
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "{name:'Aquascape & Fish',icon:'🐠'},"
          additions = " {name:'Bus Ticket',icon:'🚌'}, {name:'Car Fuel',icon:'⛽'},"
          if "{name:'Bus Ticket',icon:'🚌'}" not in s:
              if marker not in s:
                  raise SystemExit('Could not find Aquascape & Fish category in index.html')
              s = s.replace(marker, marker + additions, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const CACHE='spendwise-offline-v19';", "const CACHE='spendwise-offline-v20';", 1)
          old = "const CATEGORY_OLD=\"{name:'Room Rent',icon:'🏠'}, {name:'Clothing',icon:'👕'}, {name:'Souvenirs & Gifts',icon:'🎁'},\";"
          new = "const CATEGORY_OLD=\"{name:'Room Rent',icon:'🏠'}, {name:'Clothing',icon:'👕'}, {name:'Souvenirs & Gifts',icon:'🎁'}, {name:'Aquascape & Fish',icon:'🐠'},\";"
          s = s.replace(old, new, 1)
          old2 = "const CATEGORY_NEW=\"{name:'Room Rent',icon:'🏠'}, {name:'Clothing',icon:'👕'}, {name:'Aquascape & Fish',icon:'🐠'}, {name:'Souvenirs & Gifts',icon:'🎁'},\";"
          new2 = "const CATEGORY_NEW=\"{name:'Room Rent',icon:'🏠'}, {name:'Clothing',icon:'👕'}, {name:'Aquascape & Fish',icon:'🐠'}, {name:'Souvenirs & Gifts',icon:'🎁'}, {name:'Bus Ticket',icon:'🚌'}, {name:'Car Fuel',icon:'⛽'},\";"
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push, then remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git rm .github/workflows/add-transport-categories.yml
          git commit -m "Add Bus Ticket and Car Fuel categories"
          git push
